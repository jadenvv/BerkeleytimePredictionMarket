[profile.default]
src = "src"
test = "test"
out = "out"
libs = ["lib", "node_modules"]
solc_version = "0.8.28"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
remappings = [
  "forge-std/=lib/forge-std/src/",
  "@openzeppelin/contracts/=node_modules/@openzeppelin/contracts/",
  "solady/=node_modules/solady/src/",
]

[fmt]
line_length = 100
